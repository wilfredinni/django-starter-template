name: Get Profile
method: GET
url: $base_url/api/v1/auth/profile/
timeout: 10000
followRedirects: true
maxRedirects: 5
auth:
  type: bearer
  token: $token
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.email
    operator: equals
    value: $email
  - expression: body.password
    operator: notExists
