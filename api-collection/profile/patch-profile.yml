name: Patch Profile
method: PATCH
url: $base_url/api/v1/auth/profile/
timeout: 0
followRedirects: true
maxRedirects: 5
body: |-
  {
    "email": "$email",
    "password": "$password",
    "first_name": "$first_name",
    "last_name": "$last_name"
  }
body_type: json
auth:
  type: bearer
  token: $token
