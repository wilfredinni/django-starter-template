name: Patch Profile
method: PATCH
url: $base_url/api/v1/auth/profile/
timeout: 10000
followRedirects: true
maxRedirects: 5
body: |-
  {
    "email": "$email",
    "password": "$password",
    "first_name": "$first_name",
    "last_name": "$last_name"
  }
body_type: json
auth:
  type: bearer
  token: $token
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.email
    operator: equals
    value: $email
  - expression: body.first_name
    operator: equals
    value: $first_name
  - expression: body.last_name
    operator: equals
    value: $last_name
  - expression: body.password
    operator: notExists
