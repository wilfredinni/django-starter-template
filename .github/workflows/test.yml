name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options:
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.14"]
        os: [ubuntu-latest]

    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: django-insecure-wlgjuo53y49%-4y5(!%ksylle_ud%b=7%__@9hh+@$d%_^y3s!
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: cache deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: .venv
          key: pydeps-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: |
          uv export --locked --all-extras --no-emit-project > requirements.txt
          uv pip install --system --no-cache --require-hashes -r requirements.txt

      - name: Run Tests
        run: pytest

  api:
    name: Noodle API collections
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SUPERUSER_EMAIL: noodle-admin@example.com
      DJANGO_SUPERUSER_PASSWORD: ci-only-noodle-password-9274

    steps:
      - uses: actions/checkout@v6
      - uses: noodle-rest/setup-noodle@a964e8bf15b3e18ac4ed85480d01c2d3b6744a39 # v1.0.0
        with:
          version: v0.10.4

      - name: Start API
        run: |
          cat > .env <<'EOF'
          DEBUG=True
          DJANGO_SECRET_KEY=ci-only-django-secret-key
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=noodle_ci
          REDIS_PASSWORD=ci-only-redis-password
          EOF
          docker compose up --build --wait --wait-timeout 120 backend
          docker compose exec -T -e DJANGO_SUPERUSER_EMAIL -e DJANGO_SUPERUSER_PASSWORD \
            backend python manage.py createsuperuser --noinput

      - name: Run Noodle API collections
        env:
          password: ${{ env.DJANGO_SUPERUSER_PASSWORD }}
          password2: ${{ env.DJANGO_SUPERUSER_PASSWORD }}
        run: |
          noodle collection run api-collection auth/create-user core/ profile/ \
            --env ci --fail-fast --reporter junit --output noodle-api.xml
          noodle collection run api-collection auth/logout \
            --env ci --fail-fast --reporter junit --output noodle-logout.xml
          noodle collection run api-collection auth/logout-all \
            --env ci --fail-fast --reporter junit --output noodle-logout-all.xml

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noodle-api-results
          path: noodle-*.xml

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop API
        if: always()
        run: docker compose down --volumes
